{% extends "base.html" %}
{% load static %}
{% block content %}
<form method="post">
  {% csrf_token %}
  
  <div>
    <label for="{{ form.name.id_for_label }}">Назва категорії:</label><br>
    {{ form.name }}
  </div>

  <div>
    <label for="{{ form.parent.id_for_label }}">Батьківська категорія (необов’язково):</label><br>
    {{ form.parent }}
  </div>

  <button type="submit">Створити запит</button>
</form>
{% endblock %}
