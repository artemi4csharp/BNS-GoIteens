{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="cards-container">
      {% for item in items %}
        <div class="card">
          {% if item.image %}
            <img src="{{ item.image.url }}" alt="{{ item.name }}">
          {% else %}
            <img src="/media/items_image/default.png" alt="Default image">
          {% endif %}
          <div class="card-content">
            <p>{{ item.name }}</p>
            <div class="card-number">{{ item.price }}</div>
            <a href="{% url 'item:item_detail' item.pk %}" class="btn">Детальніше</a>
          </div>
          <div class="card-footer">
            <div class="icons">
              <a href="{% url 'save_item' item.pk item.get_content_type_id %}" title="Додати в обране">♡</a>
              <span title="Коментарі">💬</span>
              <span title="Порівняти">⚖️</span>
            </div>
            <div class="icons">
              <span title="Поділитися">🔗</span>
            </div>
          </div>
        </div>
      {% empty %}
        <p>Немає товарів</p>
      {% endfor %}
    </div>
{% endblock %}
