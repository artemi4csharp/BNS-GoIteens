{% extends "base.html" %}
{% load static %}
{% block content %}

<div style="max-width:600px; margin:60px auto; text-align:center;">
    <h2 style="color:#003B46;">Видалити послугу</h2>

    <p style="margin-top:20px; font-size:18px;">
        Ви впевнені, що хочете видалити послугу 
        <strong>"{{ service.name }}"</strong>?
    </p>

    {% if service.image %}
    <div style="margin:20px auto;">
        <img src="{{ service.image.url }}" alt="{{ service.name }}" 
             style="max-width:300px; max-height:300px; border-radius:12px; object-fit:cover;">
    </div>
    {% endif %}

    <form method="post" style="margin-top:30px;">
        {% csrf_token %}
        <div style="display:flex; justify-content:center; gap:20px;">
            <button type="submit" 
                    style="background-color:#D9534F; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">
                Так, видалити
            </button>
            <a href="{% url 'services:service_list' %}" 
               style="background-color:#003B46; color:white; text-decoration:none; padding:10px 20px; border-radius:8px;">
                Скасувати
            </a>
        </div>
    </form>
</div>

{% endblock %}
